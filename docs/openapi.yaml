  # ---------------------------------------------------------------------------
  # Notifications Endpoints
  # ---------------------------------------------------------------------------
  /api/notifications:
    get:
      summary: List Notifications (Paginated, Filtered)
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: unreadOnly
          schema:
            type: boolean
        - in: query
          name: type
          schema:
            type: string
            enum:
              - BUDGET_WARNING
              - BUDGET_CRITICAL
              - BUDGET_EXCEEDED
              - RECURRING_UPCOMING
              - RECURRING_DUE
              - GOAL_DEADLINE
              - GOAL_PROGRESS
              - MONTHLY_SUMMARY
      responses:
        '200':
          description: Paginated notifications list

  /api/notifications/unread-count:
    get:
      summary: Get Unread Notification Count
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Unread notification count

  /api/notifications/read-all:
    patch:
      summary: Mark All Notifications as Read
      tags:
        - Notifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Count of notifications marked read

  /api/notifications/{id}/read:
    patch:
      summary: Mark Single Notification as Read
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked read
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/notifications/{id}:
    delete:
      summary: Delete Notification
      tags:
        - Notifications
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

# ---------------------------------------------------------------------------
# Reusable Schemas & Responses
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    UserSettings:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        currency:
          type: string
          enum: [INR, USD, EUR, GBP, AED]
        monthlyBudgetEnabled:
          type: boolean
        monthlyBudgetAmount:
          type: number
          nullable: true
        budgetAlertsEnabled:
          type: boolean
        recurringRemindersEnabled:
          type: boolean
        goalRemindersEnabled:
          type: boolean
        monthlySummaryEnabled:
          type: boolean
        theme:
          type: string
          enum: [SYSTEM, LIGHT, DARK]

    Category:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [EXPENSE, INCOME]
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true

    Transaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [EXPENSE, INCOME]
        categoryId:
          type: string
        date:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        merchant:
          type: string
          nullable: true

    Budget:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [CATEGORY, OVERALL]
        period:
          type: string
          enum: [MONTHLY, QUARTERLY, YEARLY, CUSTOM]
        categoryId:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    RecurringTransaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [EXPENSE, INCOME]
        categoryId:
          type: string
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
        startDate:
          type: string
          format: date-time
        nextRunAt:
          type: string
          format: date-time
        active:
          type: boolean

    Goal:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        targetAmount:
          type: number
        currentAmount:
          type: number
        deadline:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, PAUSED, CANCELLED]

    GoalContribution:
      type: object
      properties:
        id:
          type: string
        goalId:
          type: string
        userId:
          type: string
        amount:
          type: number
        note:
          type: string
          nullable: true
        type:
          type: string
          enum: [MANUAL, AUTOMATED]
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
            - BUDGET_WARNING
            - BUDGET_CRITICAL
            - BUDGET_EXCEEDED
            - RECURRING_UPCOMING
            - RECURRING_DUE
            - GOAL_DEADLINE
            - GOAL_PROGRESS
            - MONTHLY_SUMMARY
        title:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
        isRead:
          type: boolean
        notificationKey:
          type: string
        createdAt:
          type: string
          format: date-time

  responses:
    ValidationError:
      description: Bad Request / Input Validation Failed
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Input validation failed

    UnauthorizedError:
      description: Authentication Required / Invalid Token
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: Authentication token missing or invalid

    NotFoundError:
      description: Resource Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND
                  message:
                    type: string
                    example: Requested resource not found

    ConflictError:
      description: Resource Conflict / Duplicate Unique Constraint
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: CONFLICT
                  message:
                    type: string
                    example: Resource already exists

    RateLimitError:
      description: Too Many Requests / Rate Limit Exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: TOO_MANY_REQUESTS
                  message:
                    type: string
                    example: Rate limit exceeded, try again later
