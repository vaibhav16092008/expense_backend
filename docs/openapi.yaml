          schema:
            type: string
            format: date
      responses:
        '200':
          description: Transactions export file payload

  /api/exports/reports:
    get:
      summary: Export Formatted Financial Reports (JSON)
      tags:
        - Data Exports
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: reportType
          schema:
            type: string
            enum: [summary, cash-flow, categories, budgets, savings]
      responses:
