openapi: 3.0.3
info:
  title: ExpenseIQ Backend API
  description: Production-grade REST API for ExpenseIQ Personal Finance Management Platform
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local Development Server
paths:
  /health:
    get:
      summary: Application Health Check
      tags:
        - Health & Operational
      responses:
        '200':
          description: Application is healthy
  /health/live:
    get:
      summary: Process Liveness Probe
      tags:
        - Health & Operational
      responses:
        '200':
          description: Application process is alive
  /health/ready:
    get:
      summary: Database Readiness Probe
      tags:
        - Health & Operational
      responses:
        '200':
          description: Application is ready and database is connected
        '503':
          description: Database connectivity check failed or shutting down
  /api/health/db:
    get:
      summary: Database Health Endpoint Alias
      tags:
        - Health & Operational
      responses:
        '200':
          description: Application is ready and database is connected
        '503':
          description: Database connectivity check failed or shutting down
  /metrics:
    get:
      summary: Operational Metrics
      tags:
        - Health & Operational
      responses:
        '200':
          description: Returns uptime, request count, and error count
  /docs:
    get:
      summary: Get OpenAPI Specification YAML
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI 3.0 specification in application/yaml format
          content:
            application/yaml:
              schema:
                type: string
  /api/docs:
    get:
      summary: Get OpenAPI Specification YAML Alias
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI 3.0 specification in application/yaml format
          content:
            application/yaml:
              schema:
                type: string

  # ---------------------------------------------------------------------------
  # Authentication Endpoints
  # ---------------------------------------------------------------------------
  /api/auth/register:
    post:
      summary: User Registration
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /api/auth/login:
    post:
      summary: User Login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated successfully. Access token returned in JSON payload, refresh token set in HTTP-only cookie.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /api/auth/refresh:
    post:
      summary: Refresh Access Token
      tags:
        - Authentication
      description: Uses HTTP-only refreshToken cookie to issue a new access token and rotated refresh cookie.
      responses:
        '200':
          description: Access token refreshed successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/logout:
    post:
      summary: Logout Session
      tags:
        - Authentication
      responses:
        '200':
          description: Current user session revoked and refresh cookie cleared

  /api/auth/logout-all:
    post:
      summary: Revoke All User Sessions
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All sessions for the current user revoked
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/me:
    get:
      summary: Get Current Session Profile
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Returns current authenticated user information
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ---------------------------------------------------------------------------
  # Users & Profile Endpoints
  # ---------------------------------------------------------------------------
  /api/users/me:
    get:
      summary: Get User Profile
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detailed profile information of authenticated user
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      summary: Update User Profile
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Profile updated successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      summary: Delete My Account
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: User account and all associated resources permanently deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/users/me/password:
    patch:
      summary: Change Password
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/users/settings:
    get:
      summary: Get User Settings
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User preferences and configuration settings
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      summary: Update User Settings
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  enum: [INR, USD, EUR, GBP, AED]
                monthlyBudgetEnabled:
                  type: boolean
                monthlyBudgetAmount:
                  type: number
                budgetAlertsEnabled:
                  type: boolean
                recurringRemindersEnabled:
                  type: boolean
                goalRemindersEnabled:
                  type: boolean
                monthlySummaryEnabled:
                  type: boolean
                theme:
                  type: string
                  enum: [SYSTEM, LIGHT, DARK]
      responses:
        '200':
          description: User settings updated successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ---------------------------------------------------------------------------
  # Categories Endpoints
  # ---------------------------------------------------------------------------
  /api/categories:
    get:
      summary: List Categories
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [EXPENSE, INCOME]
      responses:
        '200':
          description: List of user categories
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create Category
      tags:
        - Categories
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [EXPENSE, INCOME]
                color:
                  type: string
                icon:
                  type: string
      responses:
        '201':
          description: Category created successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/categories/{id}:
    get:
      summary: Get Category Details
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update Category
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [EXPENSE, INCOME]
                color:
                  type: string
                icon:
                  type: string
      responses:
        '200':
          description: Category updated successfully
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete Category
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted successfully
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Transactions Endpoints
  # ---------------------------------------------------------------------------
  /api/transactions:
    get:
      summary: List Transactions (Paginated, Filtered)
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: type
          schema:
            type: string
            enum: [EXPENSE, INCOME]
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of user transactions
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create Transaction
      tags:
        - Transactions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, type, categoryId, date]
              properties:
                amount:
                  type: number
                  minimum: 0.01
                type:
                  type: string
                  enum: [EXPENSE, INCOME]
                categoryId:
                  type: string
                date:
                  type: string
                  format: date
                note:
                  type: string
                merchant:
                  type: string
                clientRequestId:
                  type: string
                  format: uuid
                  description: Optional client-generated UUID for request idempotency during offline sync retries
      responses:
        '200':
          description: Transaction already exists (idempotent duplicate request)
        '201':
          description: Transaction created successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/transactions/export:
    get:
      summary: Export Transactions to CSV
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [EXPENSE, INCOME]
      responses:
        '200':
          description: CSV file containing filtered transactions
          content:
            text/csv:
              schema:
                type: string

  /api/transactions/{id}:
    get:
      summary: Get Transaction Details
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction details
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update Transaction
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0.01
                type:
                  type: string
                  enum: [EXPENSE, INCOME]
                categoryId:
                  type: string
                date:
                  type: string
                  format: date
                note:
                  type: string
                merchant:
                  type: string
      responses:
        '200':
          description: Transaction updated successfully
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete Transaction
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction deleted successfully
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Budgets Endpoints
  # ---------------------------------------------------------------------------
  /api/budgets:
    get:
      summary: List Budgets
      tags:
        - Budgets
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [MONTHLY, QUARTERLY, YEARLY, CUSTOM]
        - in: query
          name: categoryId
          schema:
            type: string
      responses:
        '200':
          description: List of user budgets with calculate progress
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create Budget
      tags:
        - Budgets
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, type, period, startDate, endDate]
              properties:
                amount:
                  type: number
                  minimum: 0.01
                type:
                  type: string
                  enum: [CATEGORY, OVERALL]
                period:
                  type: string
                  enum: [MONTHLY, QUARTERLY, YEARLY, CUSTOM]
                categoryId:
                  type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '201':
          description: Budget created successfully
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/budgets/{id}:
    get:
      summary: Get Budget Details
      tags:
        - Budgets
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed budget with progress metrics
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update Budget
      tags:
        - Budgets
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0.01
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Budget updated successfully
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete Budget
      tags:
        - Budgets
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Budget deleted successfully
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Dashboard Analytics Endpoints
  # ---------------------------------------------------------------------------
  /api/dashboard/summary:
    get:
      summary: Get Dashboard Financial Summary
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: High-level financial metrics (total income, total expense, net savings)

  /api/dashboard/monthly:
    get:
      summary: Get Monthly Analytics
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: months
          schema:
            type: integer
            default: 6
      responses:
        '200':
          description: Month-over-month financial breakdown

  /api/dashboard/categories:
    get:
      summary: Get Category Spending Analytics
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Category breakdown with percentage share

  /api/dashboard/trends:
    get:
      summary: Get Spending Trends
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daily/weekly spending trends data

  /api/dashboard/budget-overview:
    get:
      summary: Get Budget Overview Dashboard
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Comprehensive budget status overview

  # ---------------------------------------------------------------------------
  # Recurring Transactions Endpoints
  # ---------------------------------------------------------------------------
  /api/recurring-transactions:
    get:
      summary: List Recurring Transactions
      tags:
        - Recurring Transactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active and paused recurring transaction rules
    post:
      summary: Create Recurring Transaction Rule
      tags:
        - Recurring Transactions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, type, categoryId, frequency, startDate]
              properties:
                amount:
                  type: number
                  minimum: 0.01
                type:
                  type: string
                  enum: [EXPENSE, INCOME]
                categoryId:
                  type: string
                frequency:
                  type: string
                  enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
                startDate:
                  type: string
                  format: date
                note:
                  type: string
      responses:
        '201':
          description: Recurring transaction rule created

  /api/recurring-transactions/process:
    post:
      summary: Trigger Manual Process of Due Recurring Transactions
      tags:
        - Recurring Transactions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Summary of generated transactions and processed schedules

  /api/recurring-transactions/{id}:
    get:
      summary: Get Recurring Transaction Rule Details
      tags:
        - Recurring Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recurring transaction details
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update Recurring Transaction Rule
      tags:
        - Recurring Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0.01
                frequency:
                  type: string
                  enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
                note:
                  type: string
      responses:
        '200':
          description: Recurring transaction rule updated
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete Recurring Transaction Rule
      tags:
        - Recurring Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recurring transaction rule deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/recurring-transactions/{id}/pause:
    post:
      summary: Pause Recurring Transaction Rule
      tags:
        - Recurring Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recurring schedule paused

  /api/recurring-transactions/{id}/resume:
    post:
      summary: Resume Recurring Transaction Rule
      tags:
        - Recurring Transactions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recurring schedule resumed

  # ---------------------------------------------------------------------------
  # Financial Goals Endpoints
  # ---------------------------------------------------------------------------
  /api/goals/summary:
    get:
      summary: Get Financial Goals Summary
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Aggregated goal summary metrics

  /api/goals:
    get:
      summary: List Financial Goals
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, PAUSED, CANCELLED]
      responses:
        '200':
          description: List of financial goals
    post:
      summary: Create Financial Goal
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, targetAmount]
              properties:
                name:
                  type: string
                targetAmount:
                  type: number
                  minimum: 0.01
                deadline:
                  type: string
                  format: date
      responses:
        '201':
          description: Financial goal created

  /api/goals/{id}:
    get:
      summary: Get Financial Goal Details
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal details
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      summary: Update Financial Goal
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                targetAmount:
                  type: number
                  minimum: 0.01
                deadline:
                  type: string
                  format: date
      responses:
        '200':
          description: Goal updated successfully
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete Financial Goal
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal deleted successfully
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/goals/{id}/pause:
    post:
      summary: Pause Financial Goal
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal status changed to PAUSED

  /api/goals/{id}/resume:
    post:
      summary: Resume Financial Goal
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal status restored to ACTIVE

  /api/goals/{id}/complete:
    post:
      summary: Mark Financial Goal as Completed
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Goal status marked COMPLETED

  /api/goals/{id}/contributions:
    get:
      summary: List Goal Contributions
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contributions list for goal
    post:
      summary: Add Contribution to Goal
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  minimum: 0.01
                note:
                  type: string
      responses:
        '201':
          description: Contribution added to goal

  /api/goals/{goalId}/contributions/{contributionId}:
    delete:
      summary: Delete Goal Contribution
      tags:
        - Financial Goals
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: goalId
          required: true
          schema:
            type: string
        - in: path
          name: contributionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contribution deleted and current goal amount updated

