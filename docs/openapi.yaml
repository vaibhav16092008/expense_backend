  # ---------------------------------------------------------------------------
  # Data Exports Endpoints
  # ---------------------------------------------------------------------------
  /api/exports/transactions:
    get:
      summary: Export Raw Transactions (CSV or JSON)
      tags:
        - Data Exports
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
